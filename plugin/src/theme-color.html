<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark;font:15px/1.5 system-ui;--bg:#fff;--fg:#222;--hover:#8882}body{margin:0;padding:20px;background:var(--bg);color:var(--fg)}:root[data-theme=dark]{--bg:#191b1a;--fg:#eee}h2{margin:0 0 12px;font-size:18px}#colors{display:grid;gap:3px;max-width:320px}button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;font:inherit;text-align:left;background:transparent;color:inherit;border:0;border-radius:8px;cursor:pointer}button:hover,button:focus-visible{background:var(--hover)}button[aria-checked=true]{background:var(--hover);font-weight:600}.swatch{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid #8884;background:var(--sample)}.check{margin-left:auto}#status{font-size:13px;min-height:1.5em;margin-bottom:0}button:disabled{opacity:.55;cursor:wait}</style></head><body><h2>Theme color</h2><div id="colors" role="radiogroup" aria-label="Theme color"></div><p id="status" role="status">Loading…</p><script>/* SCRIPT */</script></body></html>
